[package]
name = "project-tether"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/tether-core",
    "crates/tether-net",
]

[features]
default = []
mcp = ["slint/mcp"]

[dependencies]
tether-core = { path = "crates/tether-core" }
tether-net = { path = "crates/tether-net" }
slint = "1.18.1"
tokio = { version = "1.40", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
